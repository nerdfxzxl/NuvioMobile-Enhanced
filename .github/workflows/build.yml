name: Android Build

on:
  push:
    branches: [ "enhanced", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Manual Git Checkout
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git init
        git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git fetch origin ${{ github.ref_name }}
        git checkout ${{ github.ref_name }}

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Rust and cargo-ndk
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
    
    - name: Install cargo-ndk utility
      run: cargo install cargo-ndk

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      env:
        NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
        NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      run: |
        test -n "$NUVIO_SUPABASE_URL" && echo "Supabase URL: present" || echo "Supabase URL: MISSING"
        test -n "$NUVIO_SUPABASE_ANON_KEY" && echo "Supabase key: present" || echo "Supabase key: MISSING"
        ./gradlew assembleDebug -Pnuvio.android.distribution=full

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: androidApp/build/outputs/apk/full/debug/*.apk
